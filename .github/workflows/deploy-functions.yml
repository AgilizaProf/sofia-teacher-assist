name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "ferramentas-privadas/**"
      - "scripts/empacotar-ferramentas.mjs"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Questões e Jogos: o conteúdo vai embutido na função `ferramenta`
      # (só entregue a quem está logado). Regera a partir de ferramentas-privadas/.
      - name: Empacotar ferramentas
        run: node scripts/empacotar-ferramentas.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --yes: sem ele a CLI pede confirmação, não consegue perguntar no CI
      # e sai com erro sem publicar nada (foi o que aconteceu no deploy de 18/11).
      - name: Deploy all edge functions
        run: |
          supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
