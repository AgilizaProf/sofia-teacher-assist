name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: |
          supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Confere se cada função sobe de verdade depois de publicar. Uma função
      # que não inicia responde 503 (BOOT_ERROR) e o app mostrava "sem internet".
      - name: Check that every function starts
        run: |
          sleep 20
          falhou=0
          for dir in supabase/functions/*/; do
            nome=$(basename "$dir")
            [ "$nome" = "_shared" ] && continue
            [ -f "$dir/index.ts" ] || continue
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS \
              "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/$nome" \
              -H "Origin: https://agilizaprof.app.br" -H "Access-Control-Request-Method: POST" --max-time 60)
            echo "$nome: $codigo"
            if [ "$codigo" != "200" ] && [ "$codigo" != "204" ]; then falhou=1; fi
          done
          if [ "$falhou" = "1" ]; then
            echo "::error::Uma ou mais funções da Sofia não iniciaram depois da publicação."
            exit 1
          fi
