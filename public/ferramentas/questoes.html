<!doctype html>
<html lang="pt-BR" class="pn" data-theme="light">
<head>
<title>Questões · AgilizaProf</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout no padrão AgilizaProf: barra branca com a marca, abas em pílulas, cabeçalho com ícone laranja, cartões brancos com borda "de bloco" embaixo. */
:root{
  --pagina:#EDF0F5; --superficie:#FFFFFF; --superficie-2:#EEF2F9; --linha:#D6DBE5; --linha-forte:#CBD3E6;
  --texto:#14161F; --texto-2:#596074; --marinho:#14161F; --sobre-marinho:#FFFFFF;
  --laranja:#0B7A55; --laranja-borda:#D2521D; --laranja-suave:#CDEFE2; --sobre-laranja:#FFFFFF;
  --azul:#2563EB; --azul-suave:#E3ECFE; --roxo:#7C3AED; --roxo-suave:#F0E8FF;
  --bom:#0E9C63; --bom-suave:#DDF5EA; --ruim:#E03131; --ruim-suave:#FDE4E4; --alerta:#B26A00; --alerta-suave:#FFF1D6; --sol:#FFC53D;
  --papel:#FFFFFF; --tinta:#111111; --zoom:1;
  --f-marca:'Sora','Sora',Georgia,serif;
  --f-ui:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-prova:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --pagina:#14161F; --superficie:#2A2E3A; --superficie-2:#1D2D58; --linha:#2B3D6B; --linha-forte:#3A5088;
  --texto:#E8EDFA; --texto-2:#A9B6D6; --marinho:#14161F; --sobre-marinho:#FFFFFF;
  --laranja:#0B7A55; --laranja-borda:#B8461A; --laranja-suave:#4A2A20; --sobre-laranja:#1B0E08;
  --azul:#7EA6FF; --azul-suave:#22366B; --roxo:#B49CFF; --roxo-suave:#33275C;
  --bom:#4CD49A; --bom-suave:#143E33; --ruim:#FF8197; --ruim-suave:#4A1F2C; --alerta:#FFC266; --alerta-suave:#3F3014;
  --papel:#F7F7F2; --tinta:#111111; color-scheme:dark;}}
:root[data-theme="dark"]{
  --pagina:#14161F; --superficie:#2A2E3A; --superficie-2:#1D2D58; --linha:#2B3D6B; --linha-forte:#3A5088;
  --texto:#E8EDFA; --texto-2:#A9B6D6; --marinho:#14161F; --sobre-marinho:#FFFFFF;
  --laranja:#0B7A55; --laranja-borda:#B8461A; --laranja-suave:#4A2A20; --sobre-laranja:#1B0E08;
  --azul:#7EA6FF; --azul-suave:#22366B; --roxo:#B49CFF; --roxo-suave:#33275C;
  --bom:#4CD49A; --bom-suave:#143E33; --ruim:#FF8197; --ruim-suave:#4A1F2C; --alerta:#FFC266; --alerta-suave:#3F3014;
  --papel:#F7F7F2; --tinta:#111111; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.img-pend .ph{display:flex;flex-direction:column;gap:4px;border:2px dashed var(--alerta);background:var(--alerta-suave);color:var(--texto);border-radius:12px;padding:14px 16px;text-align:left;max-width:560px;margin:0 auto}.img-pend .ph small{color:var(--texto-2)}.img-pend.com-img .ph{display:none}.img-pend img{max-width:100%;max-height:320px;display:block;margin:0 auto;border-radius:8px}.chip.pend{background:var(--alerta-suave);color:var(--alerta)}.chip.novo{background:var(--bom-suave);color:var(--bom)}.novidade{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--superficie);border:1.5px solid var(--linha);border-bottom:4px solid var(--bom);border-radius:16px;padding:14px 16px;margin:18px 0 6px}.novidade p{margin:4px 0 0;color:var(--texto-2);font-size:.9rem;max-width:720px}@media print{.img-pend .ph{background:#fff;border-color:#999}}
html{font-size:calc(15px * var(--zoom))}
body{background:var(--pagina);color:var(--texto);font-family:var(--f-ui);font-size:1rem;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--superficie)}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* barra da marca */
.topo{background:var(--superficie);border-bottom:1px solid var(--linha);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.topo-in{display:flex;align-items:center;gap:12px;padding-block:12px}
.marca{font-family:var(--f-marca);font-weight:900;font-size:1.35rem;letter-spacing:-.02em;white-space:nowrap;color:var(--texto)}
.marca span{color:var(--laranja)}
.topo-tit{flex:1;min-width:0;text-align:right;color:var(--texto-2);font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{display:flex;gap:4px}
.zoom button{border:0;background:var(--superficie);color:var(--texto);border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--linha-forte);width:2.2rem;height:2.2rem;font-weight:700;cursor:pointer;font-size:.85rem}
.abas{padding-block:10px 4px;display:flex;align-items:center;gap:12px}.abas[hidden]{display:none}
.abas .voltar{flex:none}.abas .onde{font-weight:700;color:var(--texto-2);font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.marca{border:0;background:none;padding:0;cursor:pointer}
.card-ini .faixa-c .cont{position:absolute;top:8px;right:10px;font-style:normal;font-weight:800;font-size:.78rem;background:var(--marinho);color:var(--sobre-marinho);border-radius:99px;padding:2px 9px}
.camera{position:fixed;inset:0;z-index:100;background:#05070D;display:flex;flex-direction:column}
.camera .cam-vid{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.camera video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.camera .cam-msg{color:#fff;text-align:center;margin:10px auto 0;padding:6px 14px;border-radius:99px;font-weight:600;font-size:.95rem;max-width:calc(100% - 32px)}
.camera .cam-msg.achou{background:#5FD3A0;color:#05261A}
.camera .cam-bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.camera .disparo{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #05070D;cursor:pointer;font-size:0}
.camera .disparo:disabled{opacity:.4}
.aba{flex:none;border:0;background:var(--superficie);color:var(--texto);border-radius:12px;padding:8px 13px;font-weight:600;font-size:.88rem;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--linha),0 3px 0 var(--linha);margin-bottom:6px;white-space:nowrap}
.aba[aria-selected="true"]{background:var(--marinho);color:var(--sobre-marinho);box-shadow:0 3px 0 #14161F}
.aba .n{font-size:.72rem;opacity:.65;margin-left:4px}
.aba.sofia{color:var(--roxo)}.aba.sofia[aria-selected="true"]{background:var(--roxo);color:#fff;box-shadow:0 3px 0 #4C1D95}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
main{padding-block:22px 80px}
.cab-pag{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.icone-pag{flex:none;width:3.6rem;height:3.6rem;border-radius:16px;background:var(--laranja);box-shadow:0 4px 0 var(--laranja-borda);display:flex;align-items:center;justify-content:center;font-size:1.7rem}
.icone-pag.roxo{background:var(--roxo);box-shadow:0 4px 0 #4C1D95}
h1,h2{font-family:var(--f-marca);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:1.85rem}
h2{font-size:1.25rem;margin-bottom:6px}
h3{font-size:1rem;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--texto-2);margin:4px 0 0;max-width:70ch;font-size:.93rem}
.grade-filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--texto-2);min-width:0}
label.campo>input,label.campo>select,label.campo>textarea,.entrada{font-weight:400;font-size:.95rem;color:var(--texto);background:var(--superficie);border:0;border-radius:12px;box-shadow:inset 0 0 0 2px var(--linha);padding:9px 12px;width:100%;min-width:0}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--superficie);color:var(--texto);border-radius:13px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.9rem;box-shadow:inset 0 0 0 2px var(--linha-forte),0 4px 0 var(--linha-forte);transition:transform .08s;text-decoration:none;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--linha-forte),0 1px 0 var(--linha-forte)}
.btn.prim{background:var(--laranja);color:var(--sobre-laranja);box-shadow:0 4px 0 var(--laranja-borda)}
.btn.prim:active:not(:disabled){box-shadow:0 1px 0 var(--laranja-borda)}
.btn.marinho{background:var(--marinho);color:var(--sobre-marinho);box-shadow:0 4px 0 #14161F}
.btn.roxo{background:var(--roxo);color:#fff;box-shadow:0 4px 0 #4C1D95}
.btn.peq{padding:6px 11px;font-size:.8rem;border-radius:11px;box-shadow:inset 0 0 0 1.5px var(--linha-forte),0 3px 0 var(--linha-forte)}
.btn.peq.prim{box-shadow:0 3px 0 var(--laranja-borda)}.btn.peq.roxo{box-shadow:0 3px 0 #4C1D95}.btn.peq.marinho{box-shadow:0 3px 0 #14161F}
.btn.perigo{color:var(--ruim)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linha-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.painel{background:var(--superficie);border-radius:16px;box-shadow:inset 0 0 0 2px var(--linha),0 4px 0 var(--linha);padding:18px;min-width:0}
.pilha{display:flex;flex-direction:column;gap:12px}
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.duas.larga{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:800px){.duas,.duas.larga{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--superficie-2);color:var(--texto-2);white-space:nowrap}
.chip.saeb{background:var(--sol);color:#3A2B00}.chip.fig{background:var(--azul-suave);color:var(--azul)}.chip.ia{background:var(--roxo-suave);color:var(--roxo)}
.chip.bom{background:var(--bom-suave);color:var(--bom)}.chip.ruim{background:var(--ruim-suave);color:var(--ruim)}.chip.alerta{background:var(--alerta-suave);color:var(--alerta)}
.pilulas{display:flex;flex-wrap:wrap;gap:6px}
.pilula{border:0;background:var(--superficie);color:var(--texto);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--linha),0 3px 0 var(--linha)}
.pilula[aria-pressed="true"]{background:var(--marinho);color:var(--sobre-marinho);box-shadow:0 3px 0 #14161F}
.pilula small{opacity:.6;margin-left:3px}
.questao{background:var(--superficie);border-radius:16px;box-shadow:inset 0 0 0 2px var(--linha),0 4px 0 var(--linha);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.questao.marcada{box-shadow:inset 0 0 0 2.5px var(--laranja),0 4px 0 var(--laranja-borda)}
.q-topo{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.q-topo .cod{font-size:.72rem;color:var(--texto-2);font-variant-numeric:tabular-nums;margin-left:auto}
.texto-base{white-space:pre-wrap;background:var(--superficie-2);border-radius:10px;padding:10px 12px;font-family:var(--f-prova);font-size:1rem;overflow-wrap:anywhere}
.figura{background:#fff;border-radius:10px;padding:8px;border:1px solid var(--linha);overflow-x:auto}
.figura img{display:block;margin:0 auto;max-height:340px}
.fonte{font-size:.75rem;color:var(--texto-2)}
.enun{font-weight:600;overflow-wrap:anywhere}
ol.alts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
ol.alts li{display:flex;gap:8px;overflow-wrap:anywhere}
ol.alts li b{flex:none;width:1.7em}
ol.alts li.certa{color:var(--bom);font-weight:700}
.q-acoes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.estrela{border:0;background:none;cursor:pointer;font-size:1.15rem;line-height:1;padding:2px 4px;color:var(--texto-2)}
.estrela[aria-pressed="true"]{color:var(--sol)}
.lista{display:flex;flex-direction:column;gap:14px}
.paginacao{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px;flex-wrap:wrap}
.barra-sel{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:18px;background:var(--marinho);color:var(--sobre-marinho);border-radius:16px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px -10px rgba(10,20,48,.5);z-index:4}
.barra-sel .btn.sec{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.vazio{padding:28px 16px;text-align:center;color:var(--texto-2);border:2px dashed var(--linha);border-radius:14px}
.aviso{background:var(--alerta-suave);border-radius:12px;padding:10px 12px;font-size:.88rem}
.ok{background:var(--bom-suave);border-radius:12px;padding:10px 12px;font-size:.9rem}
label.opc{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:.9rem}
.disc-qtd{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px}.disc-qtd label.opc{align-items:center}.disc-qtd input[type=number]{width:62px;margin-left:auto;padding:4px 6px}
label.opc input{margin-top:3px;accent-color:var(--laranja);width:1.05rem;height:1.05rem}
.tabela-wrap{overflow-x:auto;border-radius:12px;box-shadow:inset 0 0 0 2px var(--linha)}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--linha);text-align:left;white-space:nowrap}
th{background:var(--superficie-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--texto-2)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
tr:last-child td{border-bottom:0}
.medidor{height:9px;background:var(--superficie-2);border-radius:99px;overflow:hidden;min-width:60px}
.medidor i{display:block;height:100%;background:var(--azul)}
.medidor.bom i{background:var(--bom)}.medidor.ruim i{background:var(--ruim)}.medidor.alerta i{background:var(--sol)}
.resumo-num{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.resumo-num div{display:flex;flex-direction:column;background:var(--superficie);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 2px var(--linha),0 4px 0 var(--linha)}
.resumo-num b{font-family:var(--f-marca);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.resumo-num span{font-size:.76rem;color:var(--texto-2);font-weight:600}
/* Sofia */
.gs-add{display:flex;gap:8px;align-items:flex-end}.gs-add label.campo{flex:1}
.gs-chips{display:flex;flex-wrap:wrap;gap:6px}
.gs-chip{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%;border-radius:14px;padding:5px 4px 5px 12px;background:var(--roxo-suave);color:var(--texto);font-size:.82rem;line-height:1.3}
.gs-chip small{color:var(--texto-2);font-size:.72rem;font-weight:600}
.gs-chip button{border:0;background:transparent;font-size:1.05rem;line-height:1;cursor:pointer;color:var(--texto-2);padding:2px 8px;border-radius:999px}
.gs-chip button:hover{background:var(--superficie)}
.gs-chip.vazio{background:var(--alerta-suave)}
button.gs-chip.sug{border:0;background:var(--superficie-2);cursor:pointer;padding:6px 12px;font:inherit;font-size:.82rem;text-align:left}
button.gs-chip.sug:hover,button.gs-chip.sug:focus-visible{background:var(--roxo-suave)}
.gs-porque{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.gs-lista{display:flex;flex-direction:column;gap:8px}
.gs-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;background:var(--superficie);border-radius:12px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--linha)}
.gs-n{font-weight:800;color:var(--roxo);padding-top:2px}
.gs-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.gs-enun{font-size:.9rem;overflow-wrap:anywhere}
.gs-acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.gs-ver{grid-column:1/-1}
@media (max-width:700px){.gs-item{grid-template-columns:24px 1fr}.gs-acoes{grid-column:2;justify-content:flex-start}}
.sofia-cab{display:flex;gap:12px;align-items:flex-start;background:var(--roxo-suave);border-radius:16px;padding:14px 16px}
.avatar{flex:none;width:3rem;height:3rem;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#0B7A55);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-marca);font-weight:900;font-size:1.35rem;box-shadow:0 3px 0 #4C1D95}
.balao{background:var(--superficie);border-radius:4px 16px 16px 16px;padding:10px 14px;box-shadow:inset 0 0 0 2px var(--linha);font-size:.93rem;min-width:0}
.pensando{display:flex;gap:10px;align-items:center;color:var(--roxo);font-weight:600}
.pontos i{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:4px;animation:pulo 1s infinite}
.pontos i:nth-child(2){animation-delay:.15s}.pontos i:nth-child(3){animation-delay:.3s}
@keyframes pulo{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
/* Caderno SAEB */
.caderno{background:var(--papel);color:var(--tinta);border-radius:8px;box-shadow:0 1px 0 var(--linha),0 8px 30px rgba(10,20,48,.12);padding:28px clamp(16px,4vw,44px);font-family:var(--f-prova);font-size:1.06rem;max-width:820px;margin:0 auto}
.caderno .cab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--tinta);padding-bottom:8px;margin-bottom:18px;font-family:var(--f-ui);font-size:.82rem}
.caderno .cab strong{font-size:1rem}
.bloco-tit{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;background:var(--tinta);color:var(--papel);display:inline-block;padding:4px 12px;margin:10px 0 16px}
.item{margin:0 0 30px}
.item .num{font-family:var(--f-ui);font-weight:700;display:inline-flex;align-items:center;justify-content:center;min-width:2.1em;height:2.1em;border:2px solid var(--tinta);margin-bottom:8px;font-size:.9rem}
.item .suporte{white-space:pre-wrap;border:1px solid #9a9a9a;padding:12px 14px;margin:6px 0 10px;overflow-wrap:anywhere}
.item .figura{border:1px solid #9a9a9a;border-radius:0;margin:6px 0 10px}
.item .comando{margin:0 0 10px;overflow-wrap:anywhere}
.item .op{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.item .op:hover{background:#EEF2FA}
.item .op input{position:absolute;opacity:0;pointer-events:none}
.item .op .letra{flex:none;width:1.9em;height:1.9em;border-radius:50%;border:1.6px solid var(--tinta);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-ui);font-weight:600;font-size:.82rem}
.item .op:has(input:checked) .letra{background:var(--tinta);color:var(--papel)}
.item .op:has(input:focus-visible){outline:3px solid #2563EB}
.item.corrigido .op.certa{background:#DDF5EA}.item.corrigido .op.errada{background:#FBE3E7}
.ouvir{border:0;background:#EEF2FA;color:#14161F;border-radius:99px;padding:3px 10px;font-family:var(--f-ui);font-size:.75rem;font-weight:700;cursor:pointer;margin-left:8px;vertical-align:middle}
.cronometro{font-variant-numeric:tabular-nums;font-weight:800}

const IMG_OK=/^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+\/=\s]+$/i;
function imgSegura(s){s=typeof s==="string"?s.trim():"";if(!s)return "";if(IMG_OK.test(s))return s;
  try{const u=new URL(s,location.href);if(u.protocol==="https:"&&(u.origin===location.origin||(/\.supabase\.co$/i.test(u.hostname)&&u.pathname.startsWith("/storage/"))))return u.href.replace(/["'<>`\s]/g,encodeURIComponent);}catch(e){}

const TEXTO_LIVRE=new Set(["enunciado","texto","alts","explicacao","comentario","descricao","obs","tema","titulo","nome","turma","aluno","escola","prof","hab"]);
// "<" seguido de letra nunca abre uma tag; nos campos curtos (códigos, datas, ids) aspas também saem
function sanearValor(v,k,livre){
  if(typeof v==="string"){if(k==="img")return imgSegura(v);v=v.replace(/<(?=[A-Za-z!\/?])/g,"< ");return livre?v:v.replace(/["`]/g,"");}
  if(typeof v==="number")return isFinite(v)?v:0;
  if(typeof v==="boolean"||v==null)return v;
  if(Array.isArray(v))return v.map(x=>sanearValor(x,k,livre));
  if(typeof v==="object"){const o={};for(const kk of Object.keys(v)){if(kk==="__proto__"||kk==="constructor"||kk==="prototype")continue;o[kk]=sanearValor(v[kk],kk,TEXTO_LIVRE.has(kk));}return o;}
  return undefined;}
function sanearDados(d){
  if(!d||typeof d!=="object"||Array.isArray(d))return {};
  const o=sanearValor(d,"",false);
  const lista=(k,id)=>{if(o[k]===undefined)return;o[k]=Array.isArray(o[k])?o[k].filter(x=>x&&typeof x==="object"&&!Array.isArray(x)&&(!id||typeof x[id]==="string"||typeof x[id]==="number")):[];};
  lista("turmas","id");lista("simulados","id");lista("resultados","rid");lista("minhas","id");lista("relatos");
  (o.turmas||[]).forEach(t=>{t.alunos=Array.isArray(t.alunos)?t.alunos.filter(a=>a&&typeof a==="object"):[];});
  (o.simulados||[]).forEach(s=>{if(!Array.isArray(s.versoes))s.versoes=[];if(!Array.isArray(s.base))s.base=[];});
  (o.minhas||[]).forEach(q=>{if(!Array.isArray(q.alts))q.alts=["","","",""];});
  if(o.fav!==undefined&&!Array.isArray(o.fav))o.fav=[];
  if(o.aval!==undefined&&(typeof o.aval!=="object"||Array.isArray(o.aval)))o.aval={};
  if(o.sel!==undefined&&!Array.isArray(o.sel))o.sel=[];
  if(o.zoom!==undefined)o.zoom=Math.min(1.5,Math.max(.85,+o.zoom||1));
  if(o.aba!==undefined&&typeof o.aba!=="string")o.aba="inicio";
  return o;}

const NUVEM_CHAVE="simulados_dados";

function nuvem(){try{return window.parent!==window&&window.parent.aprofNuvem||null;}catch(e){return null;}}
let nuvemTimer=0,nuvemPronta=false;
function nuvemSalvar(){if(!nuvemPronta||!nuvem())return;clearTimeout(nuvemTimer);
  nuvemTimer=setTimeout(async()=>{const n=nuvem();if(!n)return;const d={};NUVEM_CAMPOS.forEach(k=>d[k]=S[k]);
    try{await n.set(NUVEM_CHAVE,d);}catch(e){toast("Não consegui salvar na nuvem agora. Os dados continuam neste aparelho e vão para a nuvem na próxima alteração.");}},1200);}
async function nuvemCarregar(){
  let n=nuvem();for(let i=0;i<30&&!n&&window.parent!==window;i++){await new Promise(r=>setTimeout(r,100));n=nuvem();}
  if(!n)return;
  let r=null;try{r=await n.get(NUVEM_CHAVE);}catch(e){nuvemPronta=true;return;}
  nuvemPronta=true;
  const d=r&&r.data&&typeof r.data==="object"?sanearDados(r.data):null;

  if(S._ts&&S._ts>=d._ts){if(S._ts>d._ts)nuvemSalvar();return;}
  if(!S._ts){

    const junta=(a,b,k)=>{const ids=new Set(a.map(x=>x[k]));return a.concat((b||[]).filter(x=>!ids.has(x[k])));};
    const loc={turmas:S.turmas,simulados:S.simulados,resultados:S.resultados,minhas:S.minhas};
    NUVEM_CAMPOS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k];});
    S.turmas=junta(S.turmas||[],loc.turmas,"id");S.simulados=junta(S.simulados||[],loc.simulados,"id");S.resultados=junta(S.resultados||[],loc.resultados,"rid");S.minhas=junta(S.minhas||[],loc.minhas,"id");
    S._ts=Date.now();

  S.minhas=S.minhas||[];S.fav=S.fav||[];S.aval=S.aval||{};limparExemplos();
  S.minhas.forEach(q=>{q.ref=q.id;q.saeb=!!q.desc;});PREF=null;HIDX=null;
  salvarLocal();if(S._ts>d._ts)nuvemSalvar();

// Provas, cartões e gabaritos (.html) abrem numa nova aba, já prontos para imprimir ou salvar em PDF.
// Planilhas e backups são baixados como arquivo. Sem "await" antes do window.open, para o navegador não bloquear a aba.
function baixar(nome,conteudo){
  try{
    const html=/\.html?$/i.test(nome);
    const tipo=html?"text/html;charset=utf-8":/\.csv$/i.test(nome)?"text/csv;charset=utf-8":"application/json;charset=utf-8";
    const url=URL.createObjectURL(new Blob([conteudo],{type:tipo}));
    setTimeout(()=>URL.revokeObjectURL(url),120000);
    if(html){const w=window.open(url,"_blank");if(w){toast("Abri o arquivo numa nova aba: lá você imprime ou salva em PDF.");return true;}}
    const a=document.createElement("a");a.href=url;a.download=nome;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
    toast("Arquivo baixado: "+nome);return true;
  }catch(e){toast("Não foi possível salvar o arquivo agora.");return false;}
}

/* ============ QR ============ */
function qrMatriz(texto){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const q=qrcode(0,"M");
  // AP2: o cabeçalho vai em modo Byte e o gabarito com as posições em modo alfanumérico, que ocupa menos espaço no QR
  const k=/^AP[234];/.test(texto)?texto.lastIndexOf(";")+1:-1;
  if(k>0){q.addData(texto.slice(0,k),"Byte");q.addData(texto.slice(k),"Alphanumeric");}else q.addData(texto,"Byte");
  q.make();
  const n=q.getModuleCount(),m=[];for(let r=0;r<n;r++){m.push([]);for(let c=0;c<n;c++)m[r].push(q.isDark(r,c));}return m;
}
function qrSvg(texto){
  const m=qrMatriz(texto),n=m.length;let p="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(m[r][c])p+=`M${c} ${r}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${p}" fill="#000"/></svg>`;
}
// Conteúdo do QR novo (AP4): AP4;simulado;versão;aluno;tipo;GABARITO[:G]. Formatos antigos, ainda lidos (AP2/AP3): AP2;simulado;versão;aluno;tipo;GABARITO:POSIÇÕES:VERSÃO-DO-BANCO
// posições = 3 caracteres base 36 por questão ("---" = questão do professor). Versão 0 = prova sem nome (matriz para fotocopiar).
// O leitor ainda entende o formato antigo AP1 (2 caracteres por posição).
function qrTexto(sim,v){
  // AP4 (QR enxuto): só o que o leitor precisa para corrigir. A ordem das questões vem do simulado salvo na conta.
  // Com menos dados, os quadradinhos do QR ficam maiores e a câmera lê com a folha inteira na foto.
  const nome=semAcento(v.nome||"").replace(/[;|:]/g," ").trim().slice(0,16);
  return ["AP4",sim.id,v.n,nome,v.tipo||"",v.gab+(cartaoGrande(sim,v.ordem.length)?":G":"")].join(";");
}
function lerQrTexto(t){
  const p=String(t).split(";");
  if(p[0]==="AP1"&&p.length>=6){const ordem=(p[5].match(/.{2}/g)||[]).map(x=>x==="__"?null:parseInt(x,36));return {simId:p[1],n:+p[2],nome:p[3],gab:p[4],ordem,tipo:""};}
  if(p[0]==="AP3"&&p.length>=6){const [gab,pos="",,tam=""]=p[5].split(":");const ordem=(pos.match(/.{4}/g)||[]).map(x=>x==="----"?null:parseInt(x,36));return {simId:p[1],n:+p[2],nome:p[3],tipo:p[4]||"",gab,ordem,grande:tam==="G"};}
  if(p[0]==="AP4"&&p.length>=6){const [gab,tam=""]=p[5].split(":");return {simId:p[1],n:+p[2],nome:p[3],tipo:p[4]||"",gab,ordem:Array(gab.length).fill(null),grande:tam==="G"};}
  if(p[0]==="AP2"&&p.length>=6){const [gab,pos="",,tam=""]=p[5].split(":");const ordem=(pos.match(/.{3}/g)||[]).map(x=>x==="---"?null:parseInt(x,36));return {simId:p[1],n:+p[2],nome:p[3],tipo:p[4]||"",gab,ordem,grande:tam==="G"};}
  return null;
}

// Cada avaliação do professor puxa para cima (ou para baixo) as questões parecidas: mesmo tema, mesma habilidade, mesmo ano e componente, mesmo tipo de figura.
const PESOS_PREF=[1.3,.9,.25,.35];
function chavesPref(q){return ["t|"+q.disc+"|"+q.ano+"|"+semAcento(q.tema||"").toLowerCase().trim(),"h|"+(q.desc?q.disc+q.ano+q.desc:q.hab||""),"d|"+q.disc+"|"+q.ano,"f|"+q.disc+"|"+(q.fig?q.fig.t:q.img?"img":"sem")];}
let PREF=null;
function prefMapa(){if(PREF)return PREF;const m={};
  for(const[ref,v]of Object.entries(S.aval)){const q=getQ(refDe(ref));if(!q)continue;chavesPref(q).forEach(k=>{if(/\|$/.test(k)||k==="h|")return;m[k]=(m[k]||0)+v;});}
  return PREF=m;}
function pontuar(q){const m=prefMapa();let s=0;chavesPref(q).forEach((k,i)=>{const v=m[k];if(v)s+=PESOS_PREF[i]*Math.max(-3,Math.min(3,v))/1.5;});return s;}
function pesoQ(q){const a=S.aval[q.ref];if(a===-1)return .06;return Math.exp(Math.max(-2.2,Math.min(2.5,pontuar(q)))*.75)*(a===1?1.6:1);}
// sorteio ponderado (Efraimidis-Spirakis): questões parecidas com as que o professor gostou saem mais vezes
function ordenarPeso(pool,r){return pool.map(q=>({q,k:Math.log(r()||1e-12)/pesoQ(q)})).sort((a,b)=>b.k-a.k).map(x=>x.q);}
function nAval(v){return Object.values(S.aval).filter(x=>x===v).length;}
function avaliar(ref,v){if(S.aval[ref]===v)delete S.aval[ref];else S.aval[ref]=v;PREF=null;salvar();return S.aval[ref]||0;}

/* ============ BANCO DE QUESTÕES ============ */
let F={ano:"",disc:"",nivel:"",tipo:"",busca:"",pag:0,gab:false,ordem:"rec"};

    (!f.tipo||(f.tipo==="saeb"&&q.saeb)||(f.tipo==="novas"&&q.novo)||(f.tipo==="novas2"&&q.novo2)||(f.tipo==="imgpend"&&q.imgPend)||(f.tipo==="fig"&&(q.fig||q.img||q.imgPend))||(f.tipo==="bncc"&&!q.saeb&&typeof q.ref==="number")||(f.tipo==="minhas"&&typeof q.ref!=="number")||(f.tipo==="fav"&&S.fav.includes(q.ref))||(f.tipo==="gostei"&&S.aval[q.ref]===1)||(f.tipo==="naogostei"&&S.aval[q.ref]===-1)||(f.tipo==="sofia"&&q.origem==="sofia")||(f.tipo==="semfig"&&!q.fig&&!q.img))&&
    (!b||(/^(d\d+|\d[a-z]\d\.\d)$/.test(b)?String(q.desc||"").toLowerCase()===b:/^ef\d{2}[a-z]{2}\d{2}$/.test(b)?String(q.hab||"").toLowerCase()===b:semAcento([q.enunciado,q.tema,q.hab,q.desc,q.texto,q.id].join(" ")).toLowerCase().includes(b))));
}
function htmlQuestao(q,{gab=false,acoes=true,num=null}={}){

   <div class="q-topo">${num!=null?`<b>${num}.</b>`:""}<span class="chip">${anoTxt(q.ano)}</span><span class="chip">${esc(DISC[q.disc]||q.disc)}</span>${d}${q.fig||q.img?'<span class="chip fig">Com figura</span>':""}${q.imgPend?'<span class="chip pend" title="A foto ainda vai ser escolhida. Enquanto isso, a questão não entra no sorteio automático.">📷 Imagem a buscar</span>':""}${q.novo?'<span class="chip novo" title="Questão da ampliação do banco">Nova</span>':""}${q.origem==="sofia"?`<span class="chip ia">${q.banco?"Sofia · no banco":"Sofia"}</span>`:""}${rec?'<span class="chip rec" title="Parecida com questões que você marcou como Gostei">Recomendada</span>':""}${acoes&&relatosAbertos().some(r=>r.qid===q.id)?'<span class="chip alerta" title="Algum professor apontou um problema nesta questão">⚠️ Relatada</span>':""}${q.origem==="manual"?'<span class="chip">Minha</span>':""}<span class="chip">${NIVEL[q.nivel]||""}</span>${q.hab?`<span class="chip">${esc(q.hab)}</span>`:""}<span class="cod">${esc(q.id)}</span>${acoes?`<button class="estrela" data-fav="${esc(q.ref)}" aria-pressed="${fav}" aria-label="Favorita" title="${fav?"Tirar das favoritas":"Marcar como favorita"}">${fav?"★":"☆"}</button>`:""}</div>
   ${q.tema?`<div class="fonte">${esc(q.tema)}${q.desc&&descNome(q.disc,q.ano,q.desc)?" · "+esc(descNome(q.disc,q.ano,q.desc)):""}</div>`:""}

   <ol class="alts">${q.alts.map((a,k)=>`<li class="${gab&&k===q.correta?"certa":""}"><b>(${L[k]})</b><span>${esc(a)}</span></li>`).join("")}</ol>
   ${acoes?`<div class="q-acoes"><button class="btn peq${sel?" prim":""}" data-sel="${esc(q.ref)}">${sel?"✓ No simulado":"+ Adicionar ao simulado"}</button><button class="btn peq" data-proj="${esc(q.ref)}">Projetar</button><button class="btn peq relatar" data-relatar="${esc(q.ref)}">⚠️ Relatar erro</button>${avalHtml(q)}</div>`:""}

function avalHtml(q){const av=S.aval[q.ref]||0;return `<span class="aval"><button data-aval="${esc(q.ref)}" data-v="1" aria-pressed="${av===1}" title="Mostrar mais questões assim">👍 Gostei</button><button data-aval="${esc(q.ref)}" data-v="-1" aria-pressed="${av===-1}" title="Mostrar menos questões assim">👎 Não gostei</button></span>`;}

function barraSel(){

function falar(txt){try{const s=window.speechSynthesis;if(!s){toast("A leitura em voz alta não funciona neste navegador.");return;}s.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="pt-BR";u.rate=.95;s.speak(u);}catch(e){toast("A leitura em voz alta não funciona neste navegador.");}}
function textoFala(q,alts){return [q.texto||"",q.enunciado,...(alts||q.alts).map((a,k)=>`Letra ${L[k]}: ${a}.`)].join(" ");}
function projetar(refs,k){
  const pj=$("#projetor");const q=getQ(refs[k]);if(!q)return;let mostra=false;
  const desenha=()=>{pj.innerHTML=`<div class="proj-in"><div class="linha-acoes" style="justify-content:space-between"><span class="marca">Agiliza<span>Prof</span></span><span class="linha-acoes"><span class="chip">${k+1} de ${refs.length}</span><button class="btn peq" id="pj-ouvir">🔊 Ouvir</button><button class="btn peq" id="pj-relatar">⚠️ Relatar erro</button><button class="btn peq" id="pj-sair">Fechar</button></span></div>
    ${q.texto?`<div class="texto-base">${esc(q.texto)}</div>`:""}${figuraHtml(q)}<div class="enun">${esc(q.enunciado)}</div>
    <ol class="alts">${q.alts.map((a,j)=>`<li class="${mostra&&j===q.correta?"certa":""}"><b>${L[j]})</b><span>${esc(a)}</span></li>`).join("")}</ol>
    <div class="linha-acoes" style="justify-content:space-between"><button class="btn" id="pj-ant"${k?"":" disabled"}>‹ Anterior</button><button class="btn prim" id="pj-resp">${mostra?"Esconder resposta":"Mostrar resposta"}</button><button class="btn" id="pj-prox"${k<refs.length-1?"":" disabled"}>Próxima ›</button></div></div>`;
    $("#pj-sair").onclick=()=>{pj.hidden=true;try{speechSynthesis.cancel();}catch(e){}};$("#pj-ouvir").onclick=()=>falar(textoFala(q));$("#pj-relatar").onclick=()=>abrirRelato(q.ref);
    $("#pj-resp").onclick=()=>{mostra=!mostra;desenha();};$("#pj-ant").onclick=()=>projetar(refs,k-1);$("#pj-prox").onclick=()=>projetar(refs,k+1);};
  desenha();pj.hidden=false;pj.scrollTop=0;
}
document.addEventListener("keydown",e=>{const pj=$("#projetor");if(pj.hidden)return;if(e.key==="Escape")$("#pj-sair")?.click();if(e.key==="ArrowRight")$("#pj-prox")?.click();if(e.key==="ArrowLeft")$("#pj-ant")?.click();});

function promptSofia(){
  const base=SF.base!=null?getQ(SF.base):null;
  const ano=base?base.ano:+SF.ano,disc=base?base.disc:SF.disc,n=Math.max(1,Math.min(10,+SF.qtd||5));
  let p=`Você é a Sofia, assistente pedagógica do AgilizaProf, especialista na BNCC e no SAEB. Crie ${n} questões ORIGINAIS de múltipla escolha, em português do Brasil, para o ${ano}º ano do Ensino Fundamental, componente ${DISC[disc]}.
Regras: exatamente 4 alternativas, uma única correta, distratores plausíveis baseados em erros comuns; linguagem adequada à idade; confira as contas e os fatos; varie a posição da alternativa correta. NUNCA use LaTeX, cifrões de fórmula ou barras invertidas: escreva frações como 1/2, potências como 3², multiplicação com × e divisão com ÷.`;
  if(base)p+=`\nAs questões devem ser PARECIDAS com esta (mesma habilidade e nível, mas com outro contexto, outros números ou outro texto):\n${JSON.stringify({texto:base.texto||"",fig:base.fig||null,enunciado:base.enunciado,alts:base.alts,correta:base.correta,hab:base.hab||"",desc:base.desc||""})}`;
  else{if(SF.tema)p+=`\nTema ou habilidade: ${SF.tema}.`;if(SF.nivel)p+=`\nDificuldade: ${NIVEL[SF.nivel]}.`;
    if(SF.estilo==="saeb")p+=`\nEstilo SAEB: cada item tem texto-base ou suporte (situação-problema, gráfico, tabela, tirinha), um comando claro e um descritor da Matriz de Referência do SAEB no campo "desc" (ex.: "D1"; para o 2º ano use os códigos da matriz 2º ano, ex.: "2N1.1").`;
    if(SF.texto.trim())p+=`\nUse este texto como texto-base das questões de leitura (copie-o no campo "texto"):\n"""${SF.texto.trim().slice(0,6000)}"""`;
    if(SF.extra.trim())p+=`\nPedido do professor: ${SF.extra.trim()}`;}
  const FT={graf:"gráficos (barras, linhas, setores, pictograma) e tabelas",geo:"figuras geométricas (malha, plano, polígono, sólidos, ângulo, régua)",tir:"tirinhas",mapa:"mapas, rosa dos ventos e plano em grade",ciclo:"ciclos, cadeias e sequências",cont:"contagem com figuras, dinheiro, relógio e termômetro"};
  const pref=SF.figTipo&&FT[SF.figTipo]?` Prefira ${FT[SF.figTipo]}.`:"";
  if(SF.img==="todas")p+=`\nTODAS as questões devem ter figura no campo "fig", e a figura deve ser necessária para responder.${pref}\n${FIG_GUIA}`;
  else if(SF.img==="algumas")p+=`\nCerca de metade das questões deve ter figura no campo "fig"; as outras ficam sem figura ("fig": null).${pref}\n${FIG_GUIA}`;
  else p+=`\nNenhuma questão deve ter figura: use sempre "fig": null e deixe tudo respondível só com texto.`;
  const gosta=temasAvaliados(disc,ano,1),naoGosta=temasAvaliados(disc,ano,-1);
  if(gosta.length)p+=`\nO professor marcou como "gostei" questões destes temas: ${gosta.join("; ")}. Siga esse estilo.`;
  if(naoGosta.length)p+=`\nO professor marcou como "não gostei" questões destes temas: ${naoGosta.join("; ")}. Evite parecer com elas.`;
  p+=`\nResponda SOMENTE com JSON neste formato: {"questoes":[{"tema":"tópico curto","hab":"código BNCC se tiver certeza, senão vazio","desc":"","nivel":1,"texto":"texto-base ou vazio","fig":null,"enunciado":"","alts":["","","",""],"correta":0,"explicacao":"por que a correta está certa, em uma frase"}]}`;
  return {p,ano,disc,n};
}
function temasAvaliados(disc,ano,v){const t=new Set();for(const[ref,x]of Object.entries(S.aval)){if(x!==v)continue;const q=getQ(refDe(ref));if(q&&q.disc===disc&&Math.abs(q.ano-ano)<=1&&q.tema)t.add(q.tema);}return [...t].slice(0,8);}
function validarSofia(o,ano,disc){
  if(!o||typeof o.enunciado!=="string"||!Array.isArray(o.alts)||o.alts.length!==4)return null;
  const c=+o.correta;if(!(c>=0&&c<=3))return null;
  const q={id:"U"+novoId()+Math.floor(Math.random()*90+10),ano,disc,tema:String(o.tema||"").slice(0,60),hab:String(o.hab||"").slice(0,12),desc:String(o.desc||"").slice(0,8),nivel:[1,2,3].includes(+o.nivel)?+o.nivel:2,
    texto:String(o.texto||""),enunciado:o.enunciado,alts:o.alts.map(String),correta:c,explicacao:String(o.explicacao||""),origem:"sofia"};
  if(SF.img!=="sem"&&o.fig&&typeof o.fig==="object"&&FIG.tipos.includes(o.fig.t)){try{if(FIG(o.fig))q.fig=o.fig;}catch(_){}}
  q.ref=q.id;q.saeb=!!q.desc;return q;
}

const SOFIA_LIGADA=false;
async function sofiaGerador(){return null;}
async function criarSofia(){
  const st=$("#sf-status"),btn=$("#sf-criar");
  const sample=await sofiaGerador();
  if(!sample){st.innerHTML=`<div class="aviso">A Sofia vai criar questões aqui em breve.</div>`;return;}
  const {p,ano,disc,n}=promptSofia();
  SF.ctl=new AbortController();btn.disabled=true;
  st.innerHTML=`<div class="pensando"><span class="pontos"><i></i><i></i><i></i></span><span>A Sofia está criando ${n} ${n===1?"questão":"questões"}…</span><button class="btn peq" id="sf-parar">Parar</button></div>`;
  $("#sf-parar").onclick=()=>SF.ctl?.abort();
  try{
    const r=await sample.json(p,{signal:SF.ctl.signal,modelTier:"default",cache:false});
    const lista=(Array.isArray(r)?r:r?.questoes||[]).map(o=>validarSofia(limparLatex(o),ano,disc)).filter(Boolean);
    if(!lista.length)throw {code:"vazio"};
    SF.res=lista.concat(SF.res).slice(0,30);st.innerHTML=`<div class="ok">Pronto! A Sofia criou ${lista.length} ${lista.length===1?"questão":"questões"}. Confira ao lado.</div>`;
  }catch(e){
    const msg={cancelled:"Pedido interrompido.",not_granted:"Para usar a Sofia, permita o uso do Claude nesta página.",rate_limited:"Muitos pedidos seguidos. Espere um pouco e tente de novo.",refused:"A Sofia não pôde atender esse pedido. Tente reformular o tema.",invalid_json:"A resposta veio incompleta. Tente de novo com menos questões.",vazio:"A resposta veio sem questões válidas. Tente de novo.",prompt_too_large:"O texto-base é grande demais. Use um trecho menor."}[e?.code]||"A Sofia não conseguiu responder agora. Tente de novo em instantes.";
    st.innerHTML=`<div class="aviso">${msg}</div>`;
  }finally{btn.disabled=false;desenharResSofia();}
}
function desenharResSofia(){
  const el=$("#sf-res");if(!el)return;
  if(!SF.res.length){el.innerHTML=`<div class="vazio">As questões criadas aparecem aqui.</div>`;return;}
  el.innerHTML=SF.res.map((q,k)=>`<div class="pilha" style="gap:6px">${htmlQuestao(q,{gab:true,acoes:false})}${q.explicacao?`<div class="fonte" style="padding:0 6px"><b>Por que:</b> ${esc(q.explicacao)}</div>`:""}<div class="linha-acoes"><button class="btn peq prim" data-guardar="${k}">Guardar</button><button class="btn peq" data-guardar-sel="${k}">Guardar e pôr no simulado</button><button class="btn peq perigo" data-descartar="${k}">Descartar</button></div></div>`).join("")+
   `<div class="linha-acoes"><button class="btn marinho" id="sf-todas">Guardar todas (${SF.res.length})</button></div>`;
  const guardar=(k,sel)=>{const q=SF.res[k];S.minhas.unshift(q);if(sel&&!S.sel.includes(q.ref)&&S.sel.length<60)S.sel.push(q.ref);SF.res.splice(k,1);salvar();montarAbas();desenharResSofia();toast(sel?"Guardada e adicionada ao simulado":"Guardada em Minhas questões");};
  el.querySelectorAll("[data-guardar]").forEach(b=>b.onclick=()=>guardar(+b.dataset.guardar,false));
  el.querySelectorAll("[data-guardar-sel]").forEach(b=>b.onclick=()=>guardar(+b.dataset.guardarSel,true));
  el.querySelectorAll("[data-descartar]").forEach(b=>b.onclick=()=>{SF.res.splice(+b.dataset.descartar,1);desenharResSofia();});
  $("#sf-todas").onclick=()=>{S.minhas=SF.res.concat(S.minhas);const n=SF.res.length;SF.res=[];salvar();montarAbas();desenharResSofia();toast(n+" questões guardadas");};
}

/* ============ DESCRITORES ============ */
function tabelaDescritores(itens,acertos){
  const dn=q=>q.disc==="GEOM"&&q.desc?"MAT":q.disc,varias=new Set(itens.filter(Boolean).map(dn)).size>1;
  const g={};itens.forEach((q,k)=>{if(!q)return;const d=q.desc||q.hab||q.tema||"—";const o=g[dn(q)+"|"+d]=g[dn(q)+"|"+d]||{q,d,n:0,a:0};o.n++;if(acertos[k])o.a++;});
  const linhas=Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0],"pt",{numeric:true})).map(([k,o])=>[varias?`${DISC[dn(o.q)]} · ${o.d}`:o.d,o]);
  return `<div class="tabela-wrap"><table><thead><tr><th>Descritor / habilidade</th><th>Acertos</th><th style="width:30%">Desempenho</th></tr></thead><tbody>${linhas.map(([d,o])=>{const p=o.a/o.n,cls=p>=.7?"bom":p>=.4?"alerta":"ruim";return `<tr><td style="white-space:normal"><b>${esc(d)}</b> ${esc(descNome(o.q.disc,o.q.ano,o.d)||o.q.tema||"")}</td><td class="num">${o.a}/${o.n}</td><td><div class="medidor ${cls}"><i style="width:${Math.round(p*100)}%"></i></div></td></tr>`;}).join("")}</tbody></table></div>`;
}

/* ============ A SOFIA MONTA PELAS HABILIDADES ============ */
// O professor diz as habilidades e os níveis; a Sofia escolhe as questões do banco olhando o histórico da turma:
// não repete o que a turma já recebeu, põe mais questões onde a turma acertou menos, segue o 👍/👎 do professor
// e aproveita o que ele planejou no app e pesquisou no banco. Cada uso fica guardado e alimenta as próximas montagens.
function histOk(){if(!S.hist||typeof S.hist!=="object"||Array.isArray(S.hist))S.hist={};if(!Array.isArray(S.hist.buscas))S.hist.buscas=[];if(!S.hist.pedidos||typeof S.hist.pedidos!=="object"||Array.isArray(S.hist.pedidos))S.hist.pedidos={};return S.hist;}
const RE_BNCC=/^EF\d{2}[A-Z]{2}\d{2}$/,RE_DESC=/^(D\d{1,2}|\d[A-Z]\d\.\d)$/;
const discBase=d=>d==="GEOM"?"MAT":d;
const idHab=h=>h.k+(h.disc?"|"+h.disc:"")+(h.livre?"|livre":"");
function habDeId(id){const [k,d]=String(id).split("|");return d?{k,disc:d}:{k};}
function habsDe(q){const v=String(q.hab||"").toUpperCase().match(/EF\d{2}[A-Z]{2}\d{2}/g)||[];if(q.desc)v.push(String(q.desc).toUpperCase()+"|"+discBase(q.disc));return v;}
// código BNCC: EF05MA08 vale para o 5º ano; EF15LP03 vale do 1º ao 5º
function bnccServe(k,ano){const a=+k[2],b=+k[3];return a===0?b===ano:ano>=a&&ano<=b;}
function casaHab(q,h){
  if(h.livre){const b=semAcento(h.k).toLowerCase();return semAcento([q.tema,q.hab].join(" ")).toLowerCase().includes(b);}
  if(RE_BNCC.test(h.k))return String(q.hab||"").toUpperCase().includes(h.k);
  return String(q.desc||"").toUpperCase()===h.k&&(!h.disc||discBase(q.disc)===h.disc);}
let HIDX=null;
function idxHabs(){if(HIDX)return HIDX;const m=new Map();
  usaveis().forEach(q=>habsDe(q).forEach(id=>{let o=m.get(id);if(!o){o={n:0,anos:{},tema:q.tema||"",disc:discBase(q.disc)};m.set(id,o);}o.n++;o.anos[q.ano]=(o.anos[q.ano]||0)+1;}));
  return HIDX=m;}
function contaHab(h,ano){
  if(h.livre)return usaveis().filter(q=>q.ano==ano&&casaHab(q,h)).length;
  const o=idxHabs().get(idHab(h));if(!o)return 0;return RE_BNCC.test(h.k)?(o.anos[ano]||o.n):(o.anos[ano]||0);}
function rotuloHab(h,ano){
  if(h.livre)return "tema";
  const o=idxHabs().get(idHab(h));
  if(!RE_BNCC.test(h.k)&&h.disc)return descNome(h.disc,ano,h.k)||(o?o.tema:"");
  return o?o.tema:"";}
// um texto digitado vira uma ou mais habilidades: código BNCC, descritor SAEB (um por componente) ou tema livre
function habsDoTexto(txt,ano,disc){
  const s=String(txt||"").trim();if(!s)return [];
  const m=s.match(/^(\S+)\s*\((.+)\)\s*$/);const cod=semAcento(m?m[1]:s).toUpperCase().replace(/\s+/g,"");
  if(RE_BNCC.test(cod))return [{k:cod}];
  if(RE_DESC.test(cod)){
    let ds=disc?[discBase(disc)]:[...new Set(Object.keys(DISC).map(discBase))].filter(d=>(idxHabs().get(cod+"|"+d)?.anos[ano]));
    if(m){const dn=semAcento(m[2]).toLowerCase().trim();const d=Object.entries(DISC).find(([k,v])=>semAcento(v).toLowerCase()===dn);if(d)ds=[discBase(d[0])];}
    return ds.map(d=>({k:cod,disc:d}));}
  return m?[]:[{k:s.slice(0,60),livre:true}];}
function opcoesHabs(ano){const out=[];
  idxHabs().forEach((o,id)=>{if(!o.anos[ano])return;const h=habDeId(id);
    if(RE_BNCC.test(h.k))out.push([h.k,`${DISC[o.disc]||""} · ${o.tema} (${o.anos[ano]} questões)`]);
    else out.push([`${h.k} (${DISC[h.disc]})`,`${descNome(h.disc,ano,h.k)||o.tema} (${o.anos[ano]} questões)`]);});
  return out.sort((a,b)=>a[0].localeCompare(b[0],"pt",{numeric:true})).map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join("");}

/* ---- histórico da turma ---- */
function turmasAlvo(){return S.turmas.filter(t=>G.turmas.includes(t.id));}
function simsDaTurma(ts){const ids=ts.map(t=>t.id);return S.simulados.filter(s=>(s.turmaIds||[s.turmaId]).some(id=>ids.includes(id)));}
function refsUsadas(ts){const u=new Set();simsDaTurma(ts).forEach(s=>(s.base||[]).forEach(r=>u.add(String(r))));return u;}
// acertos da turma em cada habilidade, somando todos os simulados corrigidos
function desempTurma(ts){
  const nomes=ts.map(t=>t.nome),ids=new Set(simsDaTurma(ts).map(s=>s.id)),m={};
  if(!ts.length)return m;
  S.resultados.forEach(r=>{if(!(nomes.includes(r.turma)||(!r.turma&&ids.has(r.simId))))return;
    (r.ordem||[]).forEach((qi,k)=>{if(qi==null)return;const q=getQ(refDe(qi));if(!q)return;const ok=r.respostas[k]===r.gab[k];
      habsDe(q).forEach(id=>{const o=m[id]=m[id]||{a:0,n:0};o.n++;if(ok)o.a++;});});});
  return m;}
function acertoDe(d,h){const o=d[idHab(h)];return o&&o.n?o.a/o.n:null;}
// habilidades do planejamento do app (planos de aula e trilhas), vindas da página-mãe
let PLAN=null;
async function carregarPlanejamento(){if(PLAN)return PLAN;const n=nuvem();if(!n||typeof n.planejamento!=="function")return PLAN=[];
  try{const r=await n.planejamento();PLAN=Array.isArray(r)?r:[];}catch(e){PLAN=[];}return PLAN;}
const chaveTurma=s=>semAcento(String(s||"")).toLowerCase().replace(/[º°ª]/g,"").replace(/\b(anos?|series?|turma|ensino|fundamental|ef|do|da|de)\b/g," ").replace(/(\d)\s*o\b/g,"$1").replace(/[^a-z0-9]/g,"");
function registrarBusca(t,ano,disc){const s=semAcento(String(t||"")).toUpperCase().replace(/\s+/g,"");if(!RE_BNCC.test(s)&&!RE_DESC.test(s))return;
  const H=histOk();H.buscas=[{t:s,ano:String(ano||""),disc:String(disc||""),ts:Date.now()}].concat(H.buscas.filter(b=>!(b.t===s&&b.ano===String(ano||"")))).slice(0,40);salvar();}
let SUG=[];
function sugestoes(ts,ano,plan){
  const grupos=[],visto=new Set(G.sofia.habs.map(idHab));
  const grupo=(titulo,lista,max)=>{const it=[];for(const x of lista){if(it.length>=max)break;const id=idHab(x.h);if(visto.has(id))continue;
      if(!x.h.livre&&!contaHab(x.h,ano))continue;if(RE_BNCC.test(x.h.k)&&!bnccServe(x.h.k,ano)&&!x.forcar)continue;visto.add(id);it.push(x);}
    if(it.length)grupos.push({titulo,itens:it});};
  const nome=ts.length===1?ts[0].nome:"estas turmas";
  const d=desempTurma(ts);
  grupo(`${ts.length===1?"A turma "+nome:"As turmas"} acertou menos`,Object.entries(d).filter(([id,o])=>o.n>=2&&o.a/o.n<.6).sort((a,b)=>a[1].a/a[1].n-b[1].a/b[1].n).map(([id,o])=>({h:habDeId(id),info:`${pct(o.a/o.n)} de acertos`,forcar:true})),6);
  if(plan.length){const ch=new Set(ts.map(t=>chaveTurma(t.nome)));let es=plan.filter(p=>ch.has(chaveTurma(p.turma)));let tit=`No seu planejamento de ${nome}`;
    if(!es.length){es=plan.filter(p=>String(p.ano||p.turma||"").match(/\d/)?.[0]==String(ano));tit=`No seu planejamento do ${anoTxt(ano)}`;}
    const cods=[];es.forEach(p=>(p.codigos||[]).forEach(c=>{if(!cods.includes(c))cods.push(c);}));
    grupo(tit,cods.map(c=>({h:{k:c},info:""})),8);}
  const ped=[];ts.forEach(t=>(histOk().pedidos[t.id]||[]).forEach(p=>(p.habs||[]).forEach(h=>ped.push({h,info:""}))));
  grupo(`Você já pediu para ${nome}`,ped,6);
  const bus=[];histOk().buscas.filter(b=>!b.ano||b.ano==ano).forEach(b=>habsDoTexto(b.t,ano,b.disc).forEach(h=>bus.push({h,info:""})));
  grupo("Você pesquisou no banco",bus,6);
  return grupos;}

/* ---- montagem ---- */
function poolHab(h,ano){let p=usaveis().filter(q=>casaHab(q,h));const doAno=p.filter(q=>q.ano==ano);if(doAno.length)p=doAno;
  const temFig=q=>!!(q.fig||q.img);if(G.sofia.fig==="so")p=p.filter(temFig);else if(G.sofia.fig==="sem")p=p.filter(q=>!temFig(q));
  return p;}
// reparte o total entre as habilidades (método de D'Hondt), sem passar do que existe no banco
function repartir(N,it){const q=it.map(()=>0);let resto=N;
  it.forEach((x,i)=>{if(resto>0&&x.max>0){q[i]=1;resto--;}});
  while(resto>0){let best=-1,bv=-1;it.forEach((x,i)=>{if(q[i]>=x.max)return;const v=x.w/(q[i]+1);if(v>bv){bv=v;best=i;}});if(best<0)break;q[best]++;resto--;}
  return q;}
function niveisSofia(){return (G.sofia.niveis.length?G.sofia.niveis:["1","2","3"]).map(Number);}
function ineditasPrimeiro(l,usadas){return l.filter(q=>!usadas.has(String(q.ref))).concat(l.filter(q=>usadas.has(String(q.ref))));}
function montarSofia(){
  const ts=turmasAlvo(),ano=+G.sofia.ano,habs=G.sofia.habs.slice();
  if(!habs.length){toast("Diga pelo menos uma habilidade para a Sofia.");return false;}
  const niveis=niveisSofia(),N=Math.max(1,Math.min(60,+G.sofia.n||10));
  const usadas=refsUsadas(ts),d=desempTurma(ts),r=rng(String(Date.now())),porque=[];
  const cand=habs.map(h=>{const p=poolHab(h,ano).filter(q=>niveis.includes(q.nivel||2));const porN={};
    niveis.forEach(nv=>{const l=ordenarPeso(p.filter(q=>(q.nivel||2)===nv),r);porN[nv]=[l.filter(q=>!usadas.has(String(q.ref))),l.filter(q=>usadas.has(String(q.ref)))];});
    return {h,porN,total:p.length,repetidas:p.filter(q=>usadas.has(String(q.ref))).length};});
  const peso=c=>{const a=acertoDe(d,c.h);return a==null?1.2:.6+1.4*(1-a);};
  const quota=repartir(N,cand.map(c=>({w:peso(c),max:c.total})));
  const esc_=[],pegos=new Set();let repetiu=0;
  // primeiro só questões inéditas para a turma, alternando os níveis; se acabarem, repete as mais antigas
  cand.forEach((c,i)=>{let k=quota[i];
    for(const fase of [0,1]){let j=0,vazios=0;const ptr={};niveis.forEach(nv=>ptr[nv]=0);
      while(k>0&&vazios<niveis.length){const nv=niveis[j++%niveis.length],l=c.porN[nv][fase];
        while(ptr[nv]<l.length&&pegos.has(l[ptr[nv]].ref))ptr[nv]++;
        if(ptr[nv]>=l.length){vazios++;continue;}vazios=0;
        const q=l[ptr[nv]++];pegos.add(q.ref);if(fase)repetiu++;esc_.push({ref:q.ref,h:c.h,nv:q.nivel||2});k--;}}});
  esc_.sort((a,b)=>a.nv-b.nv);
  const ordem=porDisc(agrupar(esc_.map(x=>x.ref)));
  G.sofia.itens=ordem.map(ref=>esc_.find(x=>x.ref===ref));G.sofia.fora=[];
  // o porquê de cada escolha, em linguagem de professor
  const nome=ts.length===1?ts[0].nome:ts.length?"as turmas marcadas":"";
  const semBanco=cand.filter(c=>!c.total).map(c=>c.h.k);
  if(semBanco.length)porque.push(`Não achei questões de ${semBanco.join(", ")} no banco para o ${anoTxt(ano)} com os níveis marcados. Tente outro nível ou o código da habilidade${SOFIA_LIGADA?', ou crie questões em "Criar com a Sofia"':""}.`);
  cand.forEach((c,i)=>{if(!quota[i])return;const a=acertoDe(d,c.h);const n=G.sofia.itens.filter(x=>idHab(x.h)===idHab(c.h)).length;
    porque.push(`${c.h.k}${c.h.disc?" ("+DISC[c.h.disc]+")":""}: ${n} ${n===1?"questão":"questões"}${a==null?"":a<.6?`, mais que as outras, porque ${nome} acertou só ${pct(a)} nos simulados anteriores`:` (${nome} acertou ${pct(a)} antes)`}.`);});
  const evitadas=cand.reduce((s,c)=>s+c.repetidas,0);
  if(ts.length&&evitadas)porque.push(repetiu?`Usei ${repetiu} ${repetiu===1?"questão que":"questões que"} ${nome} já recebeu, porque as inéditas dessas habilidades acabaram.`:`Deixei de fora ${evitadas} ${evitadas===1?"questão que":"questões que"} ${nome} já recebeu em simulados anteriores.`);
  const PLURAL={1:["fácil","fáceis"],2:["média","médias"],3:["difícil","difíceis"]};
  const nv=niveis.map(n=>{const c=G.sofia.itens.filter(x=>x.nv===n).length;return `${c} ${PLURAL[n][c===1?0:1]}`;});
  if(niveis.length>1)porque.push(`Níveis: ${nv.join(", ")}, da mais fácil para a mais difícil.`);
  if(nAval(1)||nAval(-1))porque.push("Dei preferência ao estilo das questões que você marcou com 👍 e evitei as parecidas com as marcadas com 👎.");
  if(G.sofia.itens.length<N)porque.push(`Montei ${G.sofia.itens.length} de ${N}: não há mais questões dessas habilidades com esses filtros.`);
  G.sofia.porque=porque;
  // cada pedido fica no histórico da turma e vira sugestão da próxima vez
  const H=histOk();ts.forEach(t=>{H.pedidos[t.id]=[{habs,niveis:niveis.map(String),n:N,ts:Date.now()}].concat(H.pedidos[t.id]||[]).slice(0,15);});
  salvar();
  return G.sofia.itens.length>0;}
function trocarSofia(i){const it=G.sofia.itens[i];if(!it)return;
  const usadas=refsUsadas(turmasAlvo()),atuais=new Set(G.sofia.itens.map(x=>x.ref));G.sofia.fora=(G.sofia.fora||[]).concat(it.ref);
  const p=poolHab(it.h,+G.sofia.ano).filter(q=>!atuais.has(q.ref)&&!G.sofia.fora.includes(q.ref));
  const ord=l=>ineditasPrimeiro(ordenarPeso(l,rng(String(Date.now())+i)),usadas);
  const q=ord(p.filter(q=>(q.nivel||2)===it.nv))[0]||ord(p.filter(q=>niveisSofia().includes(q.nivel||2)))[0];
  if(!q){toast("Não há outra questão dessa habilidade com esses filtros.");return;}
  G.sofia.itens[i]={ref:q.ref,h:it.h,nv:q.nivel||2};desenharSofiaPrev();}

function escolherRefs(){

function sortearDisc(disc,qtd){
  let pool=usaveis().filter(q=>q.ano==G.ano&&q.disc===disc&&(!G.nivel||q.nivel==G.nivel));
  const temFig=q=>!!(q.fig||q.img);
  if(G.fig==="so")pool=pool.filter(temFig);else if(G.fig==="sem")pool=pool.filter(q=>!temFig(q));
  const n=Math.max(1,Math.min(60,qtd||10));if(!pool.length){toast(`Não há questões de ${DISC[disc]} com esses filtros.`);return null;}
  const r=rng(String(Date.now()));pool=ordenarPeso(pool,r);
  let esc_=[];
  const minFig=G.fig==="algumas"?Math.ceil(n/3):G.fig==="muitas"?Math.ceil(n*.6):0;
  if(minFig){esc_=pool.filter(temFig).slice(0,minFig);}
  for(const q of pool){if(esc_.length>=n)break;if(!esc_.includes(q))esc_.push(q);}
  // da mais fácil para a mais difícil, mantendo juntas as questões do mesmo texto
  esc_.sort((a,b)=>(a.nivel||2)-(b.nivel||2));
  return agrupar(esc_.map(q=>q.ref));
}

// A Sofia às vezes devolve notação de LaTeX ($\frac{1}{2}$). Aqui vira texto de prova: 1/2, ×, ÷, ², √.
function semLatex(t){if(typeof t!=="string"||!/[\\$]/.test(t))return t;
  const SUP={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
  let x=t;for(let i=0;i<4;i++)x=x.replace(/\\d?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,(m,a,b)=>(/^[\w.,]+$/.test(a.trim())?a.trim():"("+a.trim()+")")+"/"+(/^[\w.,]+$/.test(b.trim())?b.trim():"("+b.trim()+")"));
  x=x.replace(/\\sqrt\s*\{([^{}]*)\}/g,"√($1)").replace(/\\(times|cdot)/g,"×").replace(/\\div/g,"÷").replace(/\\(leq|le)\b/g,"≤").replace(/\\(geq|ge)\b/g,"≥").replace(/\\neq/g,"≠").replace(/\\approx/g,"≈").replace(/\\pm/g,"±").replace(/\\pi/g,"π").replace(/\\%/g,"%").replace(/\\(circ|degree)/g,"°")
   .replace(/\^\{?\\circ\}?/g,"°").replace(/\^\{(\d+)\}|\^(\d)/g,(m,a,b)=>[...(a||b)].map(d=>SUP[d]).join("")).replace(/\\(text|mathrm|mathbf|textbf)\s*\{([^{}]*)\}/g,"$2").replace(/\\(left|right|,|;|!|quad|qquad)/g," ").replace(/\\\(|\\\)|\\\[|\\\]/g,"")
   .replace(/\$\$?([^$]*)\$\$?/g,"$1").replace(/\\([a-zA-Z]+)/g,"$1").replace(/[{}]/g,"").replace(/\^°/g,"°").replace(/ {2,}/g," ");
  return x.replace(/R ?(\d)/g,(m,d)=>/R\$/.test(t)?"R$ "+d:m);}

/* ---- Cartão-resposta: geometria em milímetros, medida a partir do canto do QR ---- */
// cartão normal e cartão "grande" (até o 5º ano e até 36 questões): bolinhas, letras e números maiores.
// O QR guarda qual dos dois foi impresso (":G" no fim), e o leitor usa a mesma geometria.
const CR_N={Q:34, y0:48, colW:44, rowH:7.5, bx0:12, bdx:7, r:2.6, cy:3.2, porCol:15, nTop:.9, nFs:10, lFs:7};
const CR_G={Q:34, y0:48, colW:58, rowH:10.5, bx0:14, bdx:10, r:3.6, cy:4.4, porCol:12, nTop:1.5, nFs:13, lFs:9.5};
let CR=CR_N;
function usarCR(grande){CR=grande?CR_G:CR_N;}
function cartaoGrande(sim,n){const anos=(sim.anos||[]).map(Number).filter(Boolean);return anos.length>0&&Math.max(...anos)<=5&&n<=36;}
function crLayout(n){const cols=Math.max(1,Math.ceil(n/CR.porCol)),rows=Math.ceil(n/cols);const pos=[];
  for(let k=0;k<n;k++){const c=Math.floor(k/rows),rr=k%rows;pos.push({c,rr,x:c*CR.colW,y:CR.y0+rr*CR.rowH});}
  return {cols,rows,pos,alt:CR.y0+rows*CR.rowH};}
function bolhaCentro(p,a){return {x:p.x+CR.bx0+a*CR.bdx,y:p.y+CR.cy};}
function caixas(qtd,txt,cls){const t=[...(txt||"").toUpperCase()];return `<div class="cx-linha ${cls||""}">${Array.from({length:qtd},(_,i)=>`<i>${t[i]&&t[i]!==" "?esc(t[i]):""}</i>`).join("")}</div>`;}
function cartaoHtml(sim,v){

  lay.pos.forEach((p,k)=>{h+=`<div class="crn" style="left:${p.x-(grande?1.8:0)}mm;top:${p.y+CR.nTop}mm${grande?`;font-size:${CR.nFs}pt;width:10mm`:""}">${k+1}</div>`;
    for(let a=0;a<4;a++){const b=bolhaCentro(p,a);h+=`<div class="crb" style="left:${b.x-CR.r}mm;top:${b.y-CR.r}mm${grande?`;width:${CR.r*2}mm;height:${CR.r*2}mm;font-size:${CR.lFs}pt;border-width:.5mm`:""}">${L[a]}</div>`;}});
  for(let c=1;c<lay.cols;c++)h+=`<div class="crsep" style="left:${c*CR.colW-3}mm;top:${CR.y0-8}mm;height:${lay.rows*CR.rowH+8}mm"></div>`;
  const esc30=sim.escola&&sim.escola.length<=30?sim.escola:"",turmaTxt=turmaDe(sim,v),tur=turmaTxt.length<=8?turmaTxt:"";
  const fxc=sim.secs?csFaixas(sim.secs):faixasDisc(v.ordem.map(getQ)).map(f=>({disc:f.d,tema:"",a:f.a,b:f.b}));
  const secsHtml=fxc.length>1||(fxc[0]&&fxc[0].tema)?`<div class="cr-secs">${fxc.map(f=>`<span><b>${f.a===f.b?f.a:f.a+" a "+f.b}</b> ${esc(DISC[f.disc]||f.disc)}${f.tema?" · "+esc(f.tema):""}</span>`).join("")}</div>`:"";
  return `<section class="folha cartao"><div class="cr-moldura">
   <div class="cr-tit"><div><span class="ap">Agiliza<span>Prof</span></span><b>CARTÃO-RESPOSTA</b></div>${v.tipo?`<div class="cr-tipo">TIPO ${v.tipo}</div>`:""}</div>
   <div class="cr-sub">${esc(sim.titulo)} · código ${sim.id}${v.n?" · nº "+v.n:""} · ${n} questões${sim.prof?" · Prof.(a) "+esc(sim.prof):""}</div>${secsHtml}
   <div class="cr-id">
    <div class="cr-campo"><span>NOME DO(A) ALUNO(A)${v.nome?` · <em>${esc(v.nome)}</em>`:""}</span>${caixas(30,"")}${caixas(30,"")}</div>
    <div class="cr-campo"><span>ESCOLA${sim.escola&&!esc30?` · <em>${esc(sim.escola)}</em>`:""}</span>${caixas(30,esc30)}</div>
    <div class="cr-lado">
     <div class="cr-campo"><span>TURMA${turmaTxt&&!tur?` · <em>${esc(turmaTxt)}</em>`:""}</span>${caixas(8,tur)}</div>
     <div class="cr-campo"><span>DATA</span><div class="cx-linha cx-data"><i></i><i></i><b>/</b><i></i><i></i><b>/</b><i></i><i></i><i></i><i></i></div></div>
    </div>
   </div>
   <div class="cr-area" style="height:${lay.alt+3}mm">
    <div class="cr-qr">${qrSvg(qrTexto(sim,v))}</div>
    <div class="cr-instr"><b>INSTRUÇÕES DE PREENCHIMENTO</b>

}
function faixasDisc(qs){const f=[];qs.forEach((q,k)=>{if(!q)return;if(!f.length||f[f.length-1].d!==q.disc)f.push({d:q.disc,a:k+1,b:k+1});else f[f.length-1].b=k+1;});return f;}
// componentes (disciplinas) de um simulado, para aparecer em todo lugar onde o simulado é mostrado
function faixasDoSim(sim){try{if(sim.secs)return csFaixas(sim.secs).map(f=>({d:f.disc,a:f.a,b:f.b}));return faixasDisc((sim.base||[]).map(getQ));}catch(e){return [];}}
function componentesTxt(sim,faixas){const fx=faixasDoSim(sim).filter(f=>f.d);if(faixas&&fx.length>1)return fx.map(f=>`${DISC[f.d]||f.d} (${f.a===f.b?"questão "+f.a:"questões "+f.a+" a "+f.b})`).join(" · ");return [...new Set(fx.map(f=>DISC[f.d]||f.d))].join(", ");}
// cada questão vira uma unidade indivisível; títulos de componente e de bloco vão junto com a questão seguinte
function unidadesQuestoes(qs,perms,blocoTam){
  const u=[];let ultimo=null,pre="";const fx=faixasDisc(qs),varias=fx.length>1;
  qs.forEach((q,k)=>{
    const f=varias&&fx.find(x=>x.a===k+1);if(f){pre+=`<div class="disc-tit">${esc(DISC[f.d]||f.d)} <span>questões ${f.a} a ${f.b}</span></div>`;ultimo=null;}
    if(blocoTam&&k%blocoTam===0)pre+=`<div class="bloco">BLOCO ${Math.floor(k/blocoTam)+1}</div>`;
    const mostra=q.texto&&q.texto!==ultimo;let aviso="";
    if(mostra){let f=k;while(f+1<qs.length&&qs[f+1].texto===q.texto)f++;if(f>k)aviso=`<p class="aviso-t">Leia o texto abaixo para responder às questões ${k+1} a ${f+1}.</p>`;}
    ultimo=q.texto||null;
    u.push(`<div class="un">${pre}<div class="q"><div class="qn">${k+1}</div><div class="qc">${aviso}${mostra?`<div class="sup">${esc(q.texto)}</div>${q.fonte?`<div class="fnt">${esc(q.fonte)}</div>`:""}`:""}${figuraDoc(q)}<p class="en">${esc(q.enunciado)}</p>${(perms?perms[k]:[0,1,2,3]).map((o,j)=>`<div class="al"><span>${L[j]}</span><div>${esc(q.alts[o])}</div></div>`).join("")}</div></div></div>`);pre="";
  });return u;
}
function questoesDoc(qs,perms,blocoTam){return unidadesQuestoes(qs,perms,blocoTam).join("");}
// 1º a 3º ano: uma coluna e letra maior; do 4º em diante: duas colunas
const colunasDe=qs=>Math.min(...qs.map(q=>+q.ano||5))<=3?1:2;
function cadernoParte(sim,v,rotulo){
  const qs=v.ordem.map(getQ);
  const cab=`<header class="cab"><div><span class="ap">Agiliza<span>Prof</span></span> · <b>${esc(sim.escola||"Escola")}</b><br>${esc(sim.titulo)}${sim.prof?" · Prof.(a) "+esc(sim.prof):""}</div><div class="cab-qr">${qrSvg(qrTexto(sim,v))}</div></header>
   <div class="ident"><div>Aluno(a): <b>${v.nome?esc(v.nome):"______________________________"}</b></div><div>Turma: ${esc(turmaDe(sim,v))}</div><div>Data: ___/___/_____</div><div>${v.tipo?`<b class="tipo-doc">TIPO ${v.tipo}</b>`:v.n?"Versão "+v.n:""}</div></div>

// Paginação feita no próprio arquivo: mede cada questão numa folha A4 de verdade e só então manda imprimir.
// Em frente e verso, cada aluno começa numa folha nova (entra uma página em branco quando sobra o verso).
const PAGINAR_JS=`function pg(c){var d=document.createElement('div');d.className='pg'+(c?' '+c:'');document.getElementById('paginas').appendChild(d);return d}
function branca(){var p=pg('branca');p.textContent='Página deixada em branco de propósito.'}
// se falta pouco espaço, diminui a figura da questão (até 30 mm de altura) em vez de deixar a coluna vazia
function encolhe(u,c){var f=u.querySelector('.fig svg,.fig img');if(!f)return false;var falta=c.scrollHeight-c.clientHeight,h=f.getBoundingClientRect().height,min=113;if(h-falta-4<min)return false;f.style.maxHeight=(h-falta-4)+'px';if(c.scrollHeight<=c.clientHeight+1)return true;f.style.maxHeight='';return false}
function cad(it,dx){var pags=[];function nova(prim){var p=pg('');p.innerHTML='<div class="pg-in">'+(prim?it.cab:'')+'<div class="cols c'+it.cols+'">'+(it.cols>1?'<div class="col"></div><div class="col"></div>':'<div class="col"></div>')+'</div><div class="rod"><span>'+it.rod+'</span><span class="pn"></span></div></div>';pags.push(p);return p}
 var p=nova(true),cols=p.querySelectorAll('.col'),ci=0;
 it.uns.forEach(function(h){var t=document.createElement('div');t.innerHTML=h;var u=t.firstChild;
  for(;;){var c=cols[ci];c.appendChild(u);if(c.scrollHeight<=c.clientHeight+1||c.children.length===1||encolhe(u,c))break;c.removeChild(u);ci++;if(ci>=cols.length){p=nova(false);cols=p.querySelectorAll('.col');ci=0}}});
 pags.forEach(function(x,i){x.querySelector('.pn').textContent='Página '+(i+1)+' de '+pags.length});
 return pags.length}
function paginar(){var dx=document.getElementById('dx').checked;document.getElementById('paginas').innerHTML='';var tot=0;
 DOC.forEach(function(it,i){var prox=DOC[i+1];
  if(it.k==='cartao'){var p=pg('pg-cartao');p.innerHTML=it.html;tot++;if(dx){branca();tot++}}
  else if(it.k==='cad'){var n=cad(it,dx);tot+=n;if(dx&&n%2){branca();tot++}}
  else{var p=pg('gp');p.innerHTML=it.html;p.style.height='auto';p.style.minHeight='296.6mm';tot++}});
 document.getElementById('nfolhas').textContent=tot+' páginas'+(dx?' ('+Math.ceil(tot/2)+' folhas em frente e verso)':'')}
paginar();document.getElementById('dx').onchange=paginar;setTimeout(function(){try{window.print()}catch(e){}},900);`;
function docPaginado(titulo,itens,duplex,dica){
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>${CSS_DOC}</style></head><body>
   <div class="barra-imp"><b>${esc(titulo)}</b><label><input type="checkbox" id="dx"${duplex?" checked":""}> Imprimir frente e verso</label><span id="nfolhas"></span><button onclick="window.print()">Imprimir</button><small>${esc(dica)} Imprima em A4, tamanho real (100%), sem margens extras.</small></div>
   <div id="paginas"></div><script>var DOC=${JSON.stringify(itens).replace(/</g,"\\u003c")};${PAGINAR_JS}<\/script></body></html>`;
}
const PRINT_JS=`<script>setTimeout(function(){try{window.print()}catch(e){}},700)<\/script>`;
// modo: "completo" (cartão + questões), "cartoes" (só cartões, só frente) ou "cadernos" (só questões)
function docImpressao(sim,{caderno,cartao,matriz}){
  const v0=sim.versoes[0]||{};
  const lista=matriz?(sim.tipos?sim.tipos.map(t=>({n:0,nome:"",tipo:t.t,ordem:t.ordem,perms:t.perms,gab:t.gab})):[{n:0,nome:"",tipo:"",ordem:v0.ordem,perms:v0.perms,gab:v0.gab}]):sim.versoes;
  if(sim.cartaoSo)caderno=false;
  const itens=[];
  lista.forEach(v=>{const rot=`${v.nome?esc(v.nome):"Aluno(a): ____________________"}${v.tipo?" · Tipo "+v.tipo:""} · ${esc(sim.titulo)}`;
    if(cartao)itens.push({k:"cartao",html:cartaoHtml(sim,v)});
    if(caderno)itens.push(cadernoParte(sim,v,rot));});
  const dica=caderno&&cartao?"Em frente e verso, o verso do cartão-resposta sai em branco e cada aluno começa numa folha nova.":caderno?"Em frente e verso, cada aluno começa numa folha nova. O gabarito do professor sai em arquivo separado.":"Cartões-resposta: imprima só na frente.";
  return docPaginado(`${sim.titulo} · ${sim.id}`,itens,!!caderno,dica);
}
function gradeGab(g,fx,n){
  return fx.map(f=>`<div class="gd"><b>${esc(DISC[f.d]||f.d)}</b><div class="gg">${Array.from({length:f.b-f.a+1},(_,j)=>{const k=f.a-1+j;return `<div class="gc"><i>${k+1}</i><b>${g[k]||"–"}</b></div>`;}).join("")}</div></div>`).join("");
}
function folhaGabarito(sim){
  const v0=sim.versoes[0];if(!v0)return "";
  const n=v0.ordem.length;let fx=faixasDisc(v0.ordem.map(getQ));if(fx.length<=1)fx=[{d:fx[0]?fx[0].d:"",a:1,b:n}];
  const unica=!sim.tipos&&(sim.modo==="igual"||!(sim.embQ||sim.embA));
  const blocos=sim.tipos?sim.tipos.map(t=>({tit:`TIPO ${t.t}`,sub:(n=>`${n} ${n===1?"aluno":"alunos"}`)(sim.versoes.filter(v=>v.tipo===t.t).length),g:t.gab})):unica?[{tit:"GABARITO",sub:"igual para todos os alunos",g:v0.gab}]:sim.versoes.map(v=>({tit:`${v.n}. ${esc(v.nome)}`,sub:"",g:v.gab}));
  const peq=blocos.length>4||blocos.length*fx.length>12;
  return `<h2>Gabarito do professor</h2>
   <p class="sub"><b>${esc(sim.titulo)}</b> · código ${sim.id} · ${esc(sim.turma)} · ${n} questões · ${sim.data}${sim.prof?" · Prof.(a) "+esc(sim.prof):""}</p>
   <div class="${peq?"peq":""}">${blocos.map(b=>`<div class="gt"><div class="gt-h">${b.tit}<span>${b.sub}</span></div>${gradeGab(b.g,fx,n)}</div>`).join("")}</div>
   ${sim.tipos?`<b style="font-size:9pt">Tipo de prova de cada aluno</b><div class="alunos">${sim.versoes.map(v=>`<div>${v.n}. ${esc(v.nome)} · <b>${v.tipo}</b></div>`).join("")}</div>`:""}
   <p class="obs">Cada quadrinho mostra o número da questão e, embaixo, a letra correta. Folha só para o professor. Se a correção for pelo Leitor QR do AgilizaProf, o gabarito já está no QR de cada cartão.</p>`;
}
function docLista(refs){
  const qs=refs.map(getQ).filter(Boolean);
  const cab=`<header class="cab"><div><span class="ap">Agiliza<span>Prof</span></span> · <b>${esc(G.escola||"Escola")}</b><br>${esc(G.titulo||"Lista de exercícios")}${G.prof?" · Prof.(a) "+esc(G.prof):""}</div></header>
   <div class="ident"><div>Nome: ______________________________</div><div>Turma: _______</div><div>Data: ___/___/_____</div><div></div></div>`;

  const gab=`<h2>Gabarito</h2><p class="sub">${esc(G.titulo||"Lista de exercícios")} · ${qs.length} questões</p><div class="gt"><div class="gt-h">GABARITO<span></span></div>${gradeGab(qs.map(q=>L[q.correta]).join(""),fx,qs.length)}</div>`;
  return docPaginado(G.titulo||"Lista de exercícios",[{k:"cad",cab,uns:unidadesQuestoes(qs,null,0),cols:colunasDe(qs),rod:esc(G.titulo||"Lista de exercícios")},{k:"gab",html:gab}],false,"A última folha traz o gabarito.");
}
function docGabaritos(sim){
  const v0=sim.versoes[0]||{ordem:sim.base};const qa=(sim.tipos?sim.tipos[0]:v0);
  const lst=`<h2 style="margin-top:4mm">Respostas por extenso${sim.tipos?" (ordem do tipo "+sim.tipos[0].t+")":""}</h2><div class="lst">${qa.ordem.map((i,k)=>{const q=getQ(i);if(!q)return "";const p=qa.perms?qa.perms[k]:[0,1,2,3];const letra=L[p.indexOf(q.correta)];return `<div><b>${k+1}. ${letra}</b> — ${esc(q.alts[q.correta])} <span style="color:#555">(${esc(DISC[q.disc]||q.disc)}${q.desc?" · "+esc(q.desc):q.hab?" · "+esc(q.hab):""})</span></div>`;}).join("")}</div>`;
  return docPaginado(`Ficha e gabarito ${sim.id}`,[{k:"gab",html:fichaSimulado(sim)},{k:"gab",html:folhaGabarito(sim)},{k:"gab",html:lst}],false,"Ficha do simulado e gabarito do professor.");
}
// Ficha do simulado para o professor: tudo o que a prova cobra, questão por questão, para imprimir e guardar.
function fichaSimulado(sim){
  const v0=sim.versoes[0]||{ordem:sim.base};const qa=(sim.tipos?sim.tipos[0]:v0);const ordem=qa.ordem||sim.base||[];
  const fx=faixasDoSim(sim);const discDe=k=>{const f=fx.find(f=>k+1>=f.a&&k+1<=f.b);return f?(DISC[f.d]||f.d):"";};
  const td='style="border:.3mm solid #000;padding:1mm 1.5mm;vertical-align:top"',th='style="border:.3mm solid #000;padding:1mm 1.5mm;background:#eee;text-align:left"';
  const linhas=ordem.map((i,k)=>{const q=getQ(i);const p=qa.perms?qa.perms[k]:[0,1,2,3];
    const letra=q&&q.alts?L[p.indexOf(q.correta)]:((qa.gab||"")[k]||"");
    const desc=q&&q.desc?`${esc(q.desc)}${descNome(q.disc,q.ano,q.desc)?" · "+esc(descNome(q.disc,q.ano,q.desc)):""}`:"";
    return `<tr style="break-inside:avoid;page-break-inside:avoid"><td ${td}><b>${k+1}</b></td><td ${td}>${esc(q&&q.disc?(DISC[q.disc]||q.disc):discDe(k))}</td><td ${td}>${esc(q&&q.hab||"")}</td><td ${td}>${desc}</td><td ${td}>${q&&q.nivel?esc(NIVEL[q.nivel]||""):""}</td><td ${td}>${esc(q&&q.tema||"")}</td><td style="border:.3mm solid #000;padding:1mm 1.5mm;text-align:center"><b>${esc(letra||"")}</b></td></tr>`;}).join("");
  const resumo=fx.filter(f=>f.d).map(f=>`<li><b>${esc(DISC[f.d]||f.d)}</b>: ${f.a===f.b?"questão "+f.a:"questões "+f.a+" a "+f.b} (${f.b-f.a+1})</li>`).join("");
  return `<h2>Ficha do simulado</h2>
   <p class="sub"><b>${esc(sim.titulo)}</b> · código ${esc(sim.id)} · ${esc(sim.data||"")}${sim.escola?" · "+esc(sim.escola):""}${sim.prof?" · Prof.(a) "+esc(sim.prof):""}</p>
   <p style="font-size:9.5pt;margin:2mm 0"><b>Turma(s):</b> ${esc(sim.turma||"–")} · <b>Questões:</b> ${ordem.length} · <b>Provas:</b> ${esc(modoTxt(sim))} · <b>Alunos:</b> ${sim.versoes.length}</p>
   ${resumo?`<p style="font-size:9.5pt;margin:2mm 0 1mm"><b>Componentes</b></p><ul style="font-size:9.5pt;margin:0 0 3mm 5mm;padding:0">${resumo}</ul>`:""}
   <table style="width:100%;border-collapse:collapse;font-size:8.5pt"><thead><tr><th ${th}>Nº</th><th ${th}>Componente</th><th ${th}>Habilidade BNCC</th><th ${th}>Descritor SAEB</th><th ${th}>Nível</th><th ${th}>Tema</th><th ${th}>Resposta${sim.tipos?" (tipo "+sim.tipos[0].t+")":""}</th></tr></thead><tbody>${linhas}</tbody></table>
   ${sim.tipos?`<p style="font-size:8.5pt;margin-top:2mm">Nos outros tipos, as mesmas questões aparecem em outra ordem. O gabarito de cada tipo está na página seguinte.</p>`:""}`;
}

/* ============ ALUNOS E TURMAS ============ */
let turmaAberta=null;
function renderAlunos(){
  if(!S.turmas.find(t=>t.id===turmaAberta))turmaAberta=S.turmas[0]?.id||null;
  const t=S.turmas.find(x=>x.id===turmaAberta);

   <div class="duas">

     <div class="grade-filtros"><label class="campo">Nova turma<input id="t-nome" placeholder="Ex.: 5º ano B"></label><label class="campo">Ano<select id="t-ano">${opcoes(ANOS,5)}</select></label></div>

     ${nuvem()&&nuvem().alunos?`<button class="btn" id="t-app" title="Usa as turmas e os alunos que você já cadastrou no AgilizaProf">Trazer turmas e alunos do app</button>`:""}
     <h2 style="margin-top:8px">Backup</h2>
     <p class="fonte" style="margin:0">Leva turmas, simulados, minhas questões, avaliações (gostei / não gostei) e resultados para outro aparelho ou navegador.</p>
     <div class="linha-acoes"><button class="btn" id="b-exp">Exportar backup</button><button class="btn" id="b-imp">Importar backup</button></div>
    </section>
    <section class="painel pilha">
     ${t?`<h2>${esc(t.nome)} ${t.exemplo?'<span class="chip alerta">turma de exemplo</span>':""}</h2>
      <div class="alunos-lista">${t.alunos.map((a,k)=>`<div><span>${k+1}. ${esc(a.nome)}</span><button class="btn peq perigo" data-tirar="${a.id}" aria-label="Remover ${esc(a.nome)}">Remover</button></div>`).join("")||`<div>Nenhum aluno ainda.</div>`}</div>
      <label class="campo">Adicionar alunos (um nome por linha; pode colar a lista do diário)<textarea id="t-lista" rows="5" placeholder="Maria Eduarda Silva&#10;João Pedro Santos"></textarea></label>
      <div class="linha-acoes"><button class="btn prim" id="t-add">Adicionar</button><button class="btn" id="t-ordem">Ordenar A–Z</button><button class="btn perigo" id="t-apagar">Apagar turma</button></div>`
     :`<div class="vazio">Crie uma turma para cadastrar os alunos.</div>`}
    </section>
   </div>`;
  $("#painel").querySelectorAll("[data-abrir]").forEach(b=>b.onclick=()=>{turmaAberta=b.dataset.abrir;renderAlunos();});
  $("#t-criar").onclick=()=>{const nome=$("#t-nome").value.trim();if(!nome){toast("Dê um nome à turma.");return;}const nt={id:novoId(),nome,ano:+$("#t-ano").value,alunos:[]};S.turmas.push(nt);turmaAberta=nt.id;salvar();renderAlunos();$("#t-lista").focus();};
  $("#b-exp").onclick=()=>baixar(`agilizaprof-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:"agilizaprof-banco",v:2,turmas:S.turmas,simulados:S.simulados,resultados:S.resultados,minhas:S.minhas,fav:S.fav,aval:S.aval}));
  if($("#t-app"))$("#t-app").onclick=async e=>{const btn=e.currentTarget;btn.disabled=true;btn.textContent="Buscando…";

      <div class="tabela-wrap"><table><thead><tr><th>Questão</th><th>Acerto</th><th>A</th><th>B</th><th>C</th><th>D</th><th>Branco</th></tr></thead><tbody>${itensQ.slice().sort((a,b)=>a.o.a/a.o.n-b.o.a/b.o.n).map(({q,o,k})=>`<tr><td style="white-space:normal;min-width:220px">${q.origem==="cartao"?`<b>Questão ${k+1}</b>`:`<b>${k+1}. ${esc(q.id)}</b> ${esc((q.enunciado||"").slice(0,70))}${q.enunciado.length>70?"…":""}`}</td><td class="num">${pct(o.a/o.n)}</td>${[0,1,2,3].map(j=>`<td class="num"${j===q.correta?' style="color:var(--bom);font-weight:800"':""}>${o.alt[j]}</td>`).join("")}<td class="num">${o.alt[4]}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  $("#painel").innerHTML=cabecalho(ICO.resultados,"Resultados e reforço","Notas da turma, desempenho por descritor do SAEB ou habilidade da BNCC e, conforme a nota de cada aluno, o que reforçar.")+`
   ${chaves.length?`<div class="linha-acoes" style="margin-bottom:14px;align-items:flex-end"><label class="campo" style="flex:1;min-width:220px">Simulado<select id="r-sim">${chaves.map(k=>`<option value="${esc(k)}"${k===RF?" selected":""}>${esc(k.split("|").slice(1).join("|"))}${(d=>d?" · "+esc(d):"")(simDisc(S.simulados.find(s=>s.id===k.split("|")[0])))} (${grupos[k].length})</option>`).join("")}</select></label>${tlist.length>1?`<label class="campo" style="min-width:180px">Turma<select id="r-turma"><option value="">Todas as turmas</option>${tlist.map(t=>`<option${t===RT?" selected":""}>${esc(t)}</option>`).join("")}</select></label>`:""}<button class="btn prim" id="r-quadro">🖨️ Imprimir resultados</button><button class="btn" id="r-csv">Planilha (CSV)</button></div><div class="pilha">${simDisc(sim)?`<p class="fonte" style="margin:0;font-size:1rem">Disciplina: <b>${esc(simDisc(sim))}</b>${sim.turma?` · Turma: <b>${esc(RT||sim.turma)}</b>`:""}</p>`:""}${analise}</div>`
   :`<div class="vazio">Ainda não há resultados. Corrija os cartões-resposta na aba Leitor QR.</div>`}`;
  if(!chaves.length)return;
  $("#r-sim").onchange=e=>{RF=e.target.value;RT="";renderResultados();};
  if($("#r-turma"))$("#r-turma").onchange=e=>{RT=e.target.value;renderResultados();};
  $("#painel").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(!b.dataset.conf){b.dataset.conf=1;b.textContent="Confirmar";return;}S.resultados=S.resultados.filter(r=>r.rid!==b.dataset.del);salvar();montarAbas();renderResultados();});
  $("#painel").querySelectorAll("[data-nomear]").forEach(sl=>sl.onchange=()=>{const r=S.resultados.find(x=>x.rid===sl.dataset.nomear);if(!r||/^Sem nome/.test(sl.value))return;
    const va=sim&&sim.versoes.find(v=>v.nome===sl.value);S.resultados=S.resultados.filter(x=>x===r||!(x.simId===r.simId&&x.aluno===sl.value));r.aluno=sl.value;if(va)r.versao=va.n;r.origem="QR";salvar();renderResultados();toast("Prova atribuída a "+sl.value);});
  if($("#r-projerr"))$("#r-projerr").onclick=()=>{const {itensQ}=analisar(rs,sim);const er=itensQ.slice().sort((a,b)=>a.o.a/a.o.n-b.o.a/b.o.n).slice(0,5).map(x=>x.qi);projetar(er,0);};
  $("#r-quadro").onclick=()=>{const css=document.querySelector("style").textContent;
    const html=`<!doctype html><html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><title>Resultados e reforço · ${esc(rs[0].titulo)}</title><style>${css}

     <body><div class="pilha" style="max-width:1000px;margin:0 auto;padding:8mm 0"><div class="cab-pag"><div class="icone-pag">📊</div><div><span class="marca">Agiliza<span>Prof</span></span><h1>Resultados e reforço</h1><p class="sub">${esc(rs[0].titulo)}${simDisc(sim)?" · Disciplina: "+esc(simDisc(sim)):""} · ${esc(RT||tlist.join(", "))} · ${hoje()}</p></div></div>${quadroHtml(rs,simV,{imprimir:true})}${reforcoHtml(rs)}${evolucaoHtml(turmaEv)}</div>${PRINT_JS}</body></html>`;

    const linhas=rs.map(r=>[r.aluno,r.turma,r.tipo||"",r.acertos,r.total,Math.round(100*r.acertos/r.total)+"%",FAIXAS[faixaDe(r.acertos/r.total)][0],r.data,...[...r.respostas].map((c,k)=>c+(c===r.gab[k]?" ✓":""))]);
    const csv="﻿"+[cab,...linhas].map(l=>l.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";")).join("\r\n");
    baixar(`resultados-${slug(rs[0].titulo)}.csv`,csv);};

<script>
/* O banco de questões fica num arquivo à parte (banco-2f4209f18d.bin), guardado no aparelho
   depois da primeira vez (Cache Storage). Antes vinha dentro desta página, em
   texto base64, e era baixado e decodificado inteiro a cada abertura. */
(function(){
 var URL_BANCO="/ferramentas/dados/banco-2f4209f18d.bin",CACHE="aprof-questoes-banco";
 function aviso(t){var p=document.getElementById("painel");if(p)p.innerHTML='<div class="vazio" style="margin:40px auto;max-width:520px;text-align:center">'+t+'</div>';}
 aviso("Abrindo o banco de questões…");
 async function buscar(){
  if(window.caches){try{var c=await caches.open(CACHE);var r=await c.match(URL_BANCO);
   if(!r){r=await fetch(URL_BANCO);if(!r.ok)throw new Error("http "+r.status);await c.put(URL_BANCO,r.clone());
    c.keys().then(function(ks){ks.forEach(function(k){if(k.url.indexOf(URL_BANCO)<0)c.delete(k);});});}
   return await r.arrayBuffer();}catch(e){/* sem Cache Storage: baixa direto */}}
  var r2=await fetch(URL_BANCO);if(!r2.ok)throw new Error("http "+r2.status);return await r2.arrayBuffer();}
 async function abrir(buf){
  var u=new Uint8Array(buf);
  if(!(u[0]===0x1f&&u[1]===0x8b))return JSON.parse(new TextDecoder().decode(u)); // já veio descomprimido
  if(typeof DecompressionStream!=="undefined"){
   var txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();return JSON.parse(txt);}
  return JSON.parse(pako.ungzip(u,{to:"string"}));}
 buscar().then(abrir).then(function(d){window.__aprofIniciarQuestoes(d);}).catch(function(e){
  console.error("[questoes] banco",e);aviso('Não consegui abrir o banco de questões. Confira a internet e <a href="javascript:location.reload()">tente de novo</a>.');});
})();
</script>
